<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9e7df">
<title>ALPOLA Coffee Shop — Online</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f4}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}#boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f5f5f4;font:14px system-ui;color:#171717;text-align:center;padding:24px}#boot p{color:#666;font-size:12px}
</style>
</head>
<body>
<div id="boot"><div><strong>ALPOLA COFFEE SHOP</strong><p>Menyiapkan koneksi database online…</p></div></div>
<iframe id="appFrame" title="ALPOLA Coffee Shop POS" src="./index.html"></iframe>
<script>
(function(){
 const frame=document.getElementById('appFrame');
 const boot=document.getElementById('boot');
 let started=false;
 frame.addEventListener('load',function(){
  if(started)return;started=true;
  try{
   const doc=frame.contentDocument;
   const sdk=doc.createElement('script');
   sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
   sdk.onload=function(){
    const cloud=doc.createElement('script');
    cloud.src='alpola-cloud.js';
    cloud.onload=function(){boot.style.display='none';};
    cloud.onerror=function(){boot.innerHTML='<div><strong>ALPOLA</strong><p>File koneksi database tidak berhasil dimuat. Coba muat ulang saat internet stabil.</p></div>';};
    doc.body.appendChild(cloud);
   };
   sdk.onerror=function(){boot.innerHTML='<div><strong>ALPOLA</strong><p>Pustaka koneksi online tidak berhasil dimuat. Periksa internet lalu muat ulang.</p></div>';};
   doc.head.appendChild(sdk);
  }catch(err){boot.innerHTML='<div><strong>ALPOLA</strong><p>Halaman online tidak dapat dibuka. Coba muat ulang.</p></div>';}
 });
})();
</script>
</body>
</html>
